[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "incontainer-editor"
version = "1.0.0"
description = "In-container editor service for FloWide Workbench"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.14.5",
]

[project.scripts]
workbench-service = "incontainer_editor.server:main"
open = "incontainer_editor.tools.open:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["incontainer_editor*"]

[tool.poetry]
name = "workbench-backend"
version = "2.0.0"
description = ""
authors = ["Balázs Görzsöny <bgorzsony@gmail.com>"]
readme = "README.md"
packages = [{include = "workbench_backend"}]

[tool.poetry.dependencies]
python = "^3.14"
fastapi = "^0.163.1"
uvicorn = {extras = ["standard"], version = "^0.54.0"}
loguru = "^0.8.0"
pydantic = "^2.14.3"
pydantic-settings = "^2.16.3"
sqlalchemy = {extras = ["asyncio"], version = "^2.1.8"}
asyncpg = "^0.32.0"
six = "^1.17.0"
overrides = "^7.7.0"
alembic = "^1.20.1"
pygit2 = "^1.21.0"
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
aiohttp = "^3.14.5"
aiodocker = "^0.27.0"
nsenter = "^0.2"
deepdiff = "^9.1.0"
python-magic = "^0.4.27"
aiofiles = "^25.1.0"
tenacity = "^9.2.1"
redis = "^8.1.0"
jinja2 = "^3.1.6"
celery = {extras = ["redis"], version = "^5.7.0"}
celery-types = "^0.26.0"
pyyaml = "^6.0.3"
httpx = "^0.28.1"
aiocache = {extras = ["redis"], version = "^0.12.3"}
python-multipart = "^0.0.33"
watchfiles = "^1.3.0"
websockets = "^17.4"


[tool.poetry.group.dev.dependencies]
pytest = "^9.2.0"
mypy = "^2.4.1"
ruff = "^0.17.5"
pytest-asyncio = "^1.5.0"
pytest-env = "^1.8.5"
taskipy = "^1.14.1"
pytest-cov = "^7.1.0"
types-python-jose = "^3.5.0.20260408"
types-pyyaml = "^6.0.12.20261113"
types-aiofiles = "^25.1.0.20261107"

[tool.pytest.ini_options]
testpaths = [ "tests" ]
asyncio_mode="strict"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore: Field name"
]
env = [
 "ENV=TEST",
]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = [
  "pydantic.mypy"
]
packages ="workbench_backend, tests"
disable_error_code="misc"
untyped_calls_exclude="aiodocker, aiocache"
exclude = "templates/_repository_templates/*"

[tool.ruff]
target-version = "py314"
exclude = [
  "alembic/versions",
  "images/**"
]
[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]


[tool.taskipy.tasks]
test = "pytest"
lint = "task lint_ruff && task lint_mypy"
lint_ruff = "ruff check"
lint_mypy = "mypy"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
